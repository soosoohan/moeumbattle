<script>
const urlParams = new URLSearchParams(window.location.search);
const wordpoolUrl = urlParams.get('wordpool');
const categoryTitle = urlParams.get('title') || '모음 배틀';

let sentences = [];
let shuffledSentences = [];
let sentenceIndex = 0;
const consonants = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

const totalRounds = 10;
let currentRound = 1;
let p1Score = 0, p2Score = 0;
let usedConsonants = new Set();
let currentTurn = 1;
let roundOver = false;
let showedAnswer = false;

let players = {
  1: { charStates: [], sentence:'', hint:'', complete:false },
  2: { charStates: [], sentence:'', hint:'', complete:false }
};

// ---------- 워드풀 로딩 ----------
async function loadWordpool() {
  if (!wordpoolUrl) { alert('워드풀 주소가 지정되지 않았습니다.'); return false; }
  try {
    const response = await fetch(wordpoolUrl);
    if (!response.ok) throw new Error('워드풀을 불러올 수 없습니다.');
    const data = await response.json();
    sentences = data.map(item => {
      const result = {};
      for (const key in item) {
        result[key] = typeof item[key] === 'string'
          ? item[key].replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '').trim()
          : item[key];
      }
      return result;
    });
    if (!Array.isArray(sentences) || sentences.length === 0) throw new Error('워드풀 형식이 올바르지 않습니다.');
    return true;
  } catch (error) {
    alert('워드풀을 불러오는 중 오류가 발생했습니다: ' + error.message);
    return false;
  }
}

function shuffleSentences() {
  shuffledSentences = [...sentences];
  for (let i = shuffledSentences.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledSentences[i], shuffledSentences[j]] = [shuffledSentences[j], shuffledSentences[i]];
  }
  sentenceIndex = 0;
}

function getNextSentence() {
  if (sentenceIndex >= shuffledSentences.length) shuffleSentences();
  return shuffledSentences[sentenceIndex++];
}

// ---------- 한글 분해/조합 (기존 로직 재사용) ----------
function containsConsonant(targetChar, consonant) {
  const consonantMap = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ' };
  const complexConsonantMap = {
    'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],
    'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']
  };
  if (targetChar === consonant) return true;
  if (consonantMap[targetChar] === consonant) return true;
  if (complexConsonantMap[targetChar] && complexConsonantMap[targetChar].includes(consonant)) return true;
  return false;
}
function getComplexConsonantComponents(consonant) {
  const map = { 'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],
    'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ'] };
  return map[consonant] || null;
}
function decomposeHangul(char) {
  const code = char.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return null;
  const jong = code % 28;
  const jung = (code - jong) / 28 % 21;
  const cho = ((code - jong) / 28 - jung) / 21;
  const choTable=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const jungTable=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const jongTable=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  return { cho:choTable[cho], jung:jungTable[jung], jong: jong===0?'':jongTable[jong] };
}
function composeHangul(cho, jung, jong='') {
  const choTable=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const jungTable=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const jongTable=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const ci=choTable.indexOf(cho), ji=jungTable.indexOf(jung), gi=jongTable.indexOf(jong);
  if (ci===-1||ji===-1||gi===-1) return null;
  return String.fromCharCode(0xAC00 + (ci*21+ji)*28+gi);
}
function isJongComplete(c) {
  if (!c.jong) return true;
  const doubleMap = { 'ㄲ':'ㄱ','ㅆ':'ㅅ' };
  if (doubleMap[c.jong]) {
    const base = doubleMap[c.jong];
    return c.foundJongComponents.has(base) || c.foundJongComponents.has(c.jong);
  }
  const comp = getComplexConsonantComponents(c.jong);
  if (!comp) return c.foundJongComponents.has(c.jong);
  return comp.every(x => c.foundJongComponents.has(x));
}
function isCharComplete(c) { return c.choFound && isJongComplete(c); }

function buildCharStates(text) {
  const states = [];
  for (let char of text) {
    if (char === ' ') { states.push({ isSpace:true }); continue; }
    const d = decomposeHangul(char);
    if (!d) { states.push({ isNonHangul:true, char }); continue; }
    states.push({ char, cho:d.cho, jung:d.jung, jong:d.jong, choFound:false, foundJongComponents:new Set(), isSpace:false, isNonHangul:false });
  }
  return states;
}

function getFoundJongDisplay(c) {
  if (!c.jong) return '';
  const doubleMap = { 'ㄲ':'ㄱ','ㅆ':'ㅅ' };
  if (doubleMap[c.jong]) {
    const base = doubleMap[c.jong];
    return (c.foundJongComponents.has(base) || c.foundJongComponents.has(c.jong)) ? c.jong : '';
  }
  const comp = getComplexConsonantComponents(c.jong);
  if (!comp) return c.foundJongComponents.has(c.jong) ? c.jong : '';
  const found = comp.filter(x => c.foundJongComponents.has(x));
  if (found.length === 0) return '';
  return found.length === comp.length ? c.jong : found.join('');
}

function renderCharStates(charStates, revealAll) {
  const words = []; let cur = [];
  charStates.forEach(c => {
    if (c.isSpace) { if (cur.length) { words.push(cur); cur=[]; } return; }
    if (c.isNonHangul) { cur.push(`<span class="hangul-char complete-char">${c.char}</span>`); return; }
    if (revealAll) {
      cur.push(`<span class="hangul-char complete-char">${c.char}</span>`);
      return;
    }
    const dispCho = c.choFound ? c.cho : '';
    const dispJung = c.jung;
    const dispJong = getFoundJongDisplay(c);
    if (dispCho && dispJong) cur.push(`<span class="hangul-char complete-char">${composeHangul(dispCho,dispJung,dispJong)}</span>`);
    else if (dispCho && !c.jong) cur.push(`<span class="hangul-char complete-char">${composeHangul(dispCho,dispJung)}</span>`);
    else if (dispCho) cur.push(`<span class="hangul-char incomplete-char">${composeHangul(dispCho,dispJung)}</span>`);
    else if (dispJong) cur.push(`<span class="hangul-char incomplete-char" style="position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:1em;height:1.2em;"><span style="font-size:.8em;">${dispJung}</span><span style="font-size:.7em;margin-top:-.1em;">${dispJong}</span></span>`);
    else cur.push(`<span class="hangul-char incomplete-char">${dispJung}</span>`);
  });
  if (cur.length) words.push(cur);
  return words.map(w => `<span class="word-group">${w.join('')}</span>`).join('');
}

// ---------- 라운드 진행 ----------
function startRound() {
  roundOver = false;
  showedAnswer = false;
  usedConsonants = new Set();

  let s1 = getNextSentence();
  let s2 = getNextSentence();
  if (s2.text === s1.text && shuffledSentences.length > 1) s2 = getNextSentence();

  players[1] = { charStates: buildCharStates(s1.text), sentence: s1.text, hint: s1.hint, complete:false };
  players[2] = { charStates: buildCharStates(s2.text), sentence: s2.text, hint: s2.hint, complete:false };

  currentTurn = (currentRound % 2 === 1) ? 1 : 2;

  document.getElementById('roundDisplay').textContent = `라운드 ${currentRound}/${totalRounds}`;
  document.getElementById('hint1').textContent = `💡 ${s1.hint}`;
  document.getElementById('hint2').textContent = `💡 ${s2.hint}`;
  document.getElementById('result1').textContent = '';
  document.getElementById('result2').textContent = '';
  document.getElementById('panel1').classList.remove('done');
  document.getElementById('panel2').classList.remove('done');
  document.getElementById('finalArea').innerHTML = '';
  document.getElementById('controlSection').innerHTML = '';

  updateScoreDisplay();
  renderAll();
  createConsonantButtons();
}

function updateScoreDisplay() {
  document.getElementById('scoreDisplay').textContent = `1번: ${p1Score}점 | 2번: ${p2Score}점`;
}

function renderAll() {
  document.getElementById('sentence1').innerHTML = renderCharStates(players[1].charStates, showedAnswer && !players[1].complete);
  document.getElementById('sentence2').innerHTML = renderCharStates(players[2].charStates, showedAnswer && !players[2].complete);

  document.getElementById('panel1').classList.toggle('active-turn', !roundOver && currentTurn===1);
  document.getElementById('panel2').classList.toggle('active-turn', !roundOver && currentTurn===2);
  document.getElementById('turnBadge1').textContent = (!roundOver && currentTurn===1) ? '← 지금 차례' : '';
  document.getElementById('turnBadge2').textContent = (!roundOver && currentTurn===2) ? '← 지금 차례' : '';
}

function createConsonantButtons() {
  const grid = document.getElementById('consonantGrid');
  grid.innerHTML = '';
  consonants.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'consonant-btn available';
    btn.textContent = c;
    btn.id = `btn-${c}`;
    btn.onclick = () => handleConsonantClick(c);
    grid.appendChild(btn);
  });
}

function applyConsonantToPlayer(playerNum, consonant) {
  const p = players[playerNum];
  let found = false;
  p.charStates.forEach(c => {
    if (c.isSpace || c.isNonHangul) return;
    if (!c.choFound && containsConsonant(c.cho, consonant)) { c.choFound = true; found = true; }
    if (c.jong && containsConsonant(c.jong, consonant) && !c.foundJongComponents.has(consonant)) {
      c.foundJongComponents.add(consonant);
      found = true;
    }
  });
  const allComplete = p.charStates.every(c => c.isSpace || c.isNonHangul || isCharComplete(c));
  if (allComplete) p.complete = true;
  return found;
}

function handleConsonantClick(consonant) {
  if (roundOver || usedConsonants.has(consonant)) return;

  usedConsonants.add(consonant);
  document.getElementById(`btn-${consonant}`).className = 'consonant-btn used';

  const wasComplete1 = players[1].complete;
  const wasComplete2 = players[2].complete;

  applyConsonantToPlayer(1, consonant);
  applyConsonantToPlayer(2, consonant);

  const newlyDone1 = !wasComplete1 && players[1].complete;
  const newlyDone2 = !wasComplete2 && players[2].complete;

  if (newlyDone1 || newlyDone2) {
    roundOver = true;
    if (newlyDone1 && newlyDone2) {
      p1Score += 1; p2Score += 1;
      document.getElementById('result1').textContent = '🤝 동시! +1점';
      document.getElementById('result1').className = 'player-result tie';
      document.getElementById('result2').textContent = '🤝 동시! +1점';
      document.getElementById('result2').className = 'player-result tie';
    } else if (newlyDone1) {
      p1Score += 2;
      document.getElementById('result1').textContent = '🎉 먼저 완성! +2점';
      document.getElementById('result1').className = 'player-result win';
    } else {
      p2Score += 2;
      document.getElementById('result2').textContent = '🎉 먼저 완성! +2점';
      document.getElementById('result2').className = 'player-result win';
    }
    document.getElementById('panel1').classList.add('done');
    document.getElementById('panel2').classList.add('done');
    updateScoreDisplay();
    showRoundControls();
  } else {
    currentTurn = currentTurn === 1 ? 2 : 1;
  }

  renderAll();

  if (usedConsonants.size >= consonants.length && !roundOver) {
    roundOver = true;
    showRoundControls();
    renderAll();
  }
}

function showRoundControls() {
  const controls = document.getElementById('controlSection');
  controls.innerHTML = '';
  if (!showedAnswer) {
    const answerBtn = document.createElement('button');
    answerBtn.className = 'action-btn secondary';
    answerBtn.textContent = '정답 확인';
    answerBtn.onclick = () => { showedAnswer = true; renderAll(); };
    controls.appendChild(answerBtn);
  }
  const nextBtn = document.createElement('button');
  nextBtn.className = 'action-btn';
  nextBtn.textContent = currentRound >= totalRounds ? '결과 보기' : '다음 라운드 →';
  nextBtn.onclick = nextRound;
  controls.appendChild(nextBtn);
}

function nextRound() {
  if (currentRound >= totalRounds) { showFinalScore(); return; }
  currentRound++;
  startRound();
}

function showFinalScore() {
  const winner = p1Score > p2Score ? '1번 승리! 🏆' : p2Score > p1Score ? '2번 승리! 🏆' : '무승부! 🤝';
  document.getElementById('finalArea').innerHTML =
    `<div class="final-alert">🎊 게임 종료 🎊<br>${winner}<br>1번: ${p1Score}점 | 2번: ${p2Score}점</div>`;
  document.getElementById('battleContainer').style.display = 'none';
  document.getElementById('controlSection').innerHTML = `
    <button class="action-btn" onclick="restartGame()">🔄 새 게임</button>
    <button class="action-btn secondary" onclick="location.href='https://soosooland.com/doori/index.html'">🏠 다른 게임</button>`;
}

function restartGame() {
  currentRound = 1;
  p1Score = 0; p2Score = 0;
  document.getElementById('battleContainer').style.display = 'flex';
  startRound();
}

window.onload = async function () {
  const ok = await loadWordpool();
  if (ok) {
    document.getElementById('categoryTitle').textContent = categoryTitle;
    shuffleSentences();
    startRound();
  }
};
</script>
</body>
</html>
